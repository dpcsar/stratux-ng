name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  image:
    name: Build pi-gen image
    # Build natively on arm64: pi-gen only needs QEMU/binfmt_misc user-mode
    # emulation to cross-build an arm64 image on an x86_64 host. GitHub-hosted
    # arm64 Linux runners are free/unlimited for public repos, and pi-gen's own
    # scripts already skip the binfmt_misc requirement entirely when the host
    # is native aarch64/arm64 (see build-docker.sh/scripts/dependencies_check).
    # This avoids an entire class of QEMU/binfmt_misc breakage we hit trying to
    # cross-build from ubuntu-latest (x86_64): upstream pi-gen changing its
    # qemu package requirement between tags, and (seemingly) GitHub's hosted
    # x86_64 runner environment not actually supporting working binfmt_misc
    # registration inside a nested --privileged container regardless of how
    # it's set up on the host.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: true

      - name: Ensure Docker
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y docker.io
          fi
          sudo systemctl start docker || sudo service docker start || true
          docker version

      - name: Build image
        env:
          PIGEN_ARCH: arm64
        run: make image

      - name: Collect deploy artifacts
        run: |
          mkdir -p dist
          cp -a build/pi-gen-src/deploy/. dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: stratux-ng_${{ github.ref_name }}_pigen_deploy
          path: dist/**
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: image
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/**
